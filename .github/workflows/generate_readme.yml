name: Generate GitBlog README

env:
  GITHUB_NAME: cufezhusy
  GITHUB_EMAIL: shengyao.zhu@gmail.com

on:
  workflow_dispatch:
  issues:
    types: [opened, edited]
  # Owner-only in practice: the job `if` below rejects comments from anyone
  # else, so this trigger cannot be used by a third party to run the job.
  issue_comment:
    types: [created, edited]
  push:
    branches:
      - main
    paths:
      - main.py
      - requirements.txt
      - requirements.in

# Default to read-only; the job opts into contents: write for the push below.
permissions:
  contents: read

# Serialise runs: two events can otherwise race and push conflicting commits.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  sync:
    name: Generate README
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       github.event.issue.user.login == github.repository_owner &&
       github.event.comment.user.login == github.repository_owner)
    permissions:
      # Needed only by the final `git push` step.
      contents: write
      # Read issues/comments to regenerate README and BACKUP.
      issues: read
    steps:
      - name: Checkout
        # Pinned to the v4 commit. Keep the version in the comment so the
        # SHA can be refreshed deliberately.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Required so the final step can push the regenerated README.
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --disable-pip-version-check --require-hashes -r requirements.txt

      - name: Generate new md
        env:
          # Use the workflow's short-lived token instead of a long-lived PAT.
          # The job grants only contents: write and issues: read.
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          source venv/bin/activate
          # The token stays in the environment (main.py reads GH_TOKEN) instead
          # of being visible in the process list as an argv value.
          python main.py "$REPO" --issue_number "$ISSUE_NUMBER"

      - name: Push README
        env:
          # Only the retry path needs the API: it regenerates on top of the
          # latest main when another run pushed first.
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          git config --local user.email "shengyao.zhu@gmail.com"
          git config --local user.name "cufezhusy"

          commit_generated() {
            git add -- README.md BACKUP
            if git diff --cached --quiet; then
              return 1
            fi
            git commit -m 'update new blog'
          }

          if ! commit_generated; then
            echo "nothing to commit"
            exit 0
          fi

          # Overlapping runs (e.g. an issue is opened and then edited) can
          # start from the same commit. A run that was cancelled by
          # cancel-in-progress may still reach this step and push, leaving
          # the newer run behind. If the push is rejected, reset onto the new
          # head, regenerate from the current issue state, and retry.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              break
            fi
            echo "::warning::push rejected (attempt $attempt); regenerating on latest main"
            git fetch --quiet origin main
            git reset --hard --quiet origin/main
            source venv/bin/activate
            python main.py "$REPO" --issue_number "$ISSUE_NUMBER"
            if ! commit_generated; then
              echo "nothing to commit after syncing with main"
              exit 0
            fi
          done
          # Do not swallow failures: a broken push should fail the run loudly.
          echo "::error::could not push README after 3 attempts"
          exit 1
