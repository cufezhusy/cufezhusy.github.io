name: Generate GitBlog README

env:
  GITHUB_NAME: cufezhusy
  GITHUB_EMAIL: shengyao.zhu@gmail.com

on:
  workflow_dispatch:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  push:
    branches:
      - main
    paths:
      - main.py
      - requirements.txt
      - requirements.in

jobs:
  sync:
    name: Generate README
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'issues' && github.event.issue.user.login == github.repository_owner) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && github.event.comment.user.login == github.repository_owner)
    permissions:
      contents: write
      issues: read
    steps:
      - name: Checkout
        # Pinned to the v4 commit. Keep the version in the comment so the
        # SHA can be refreshed deliberately.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Required so the final step can push the regenerated README.
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --disable-pip-version-check --require-hashes -r requirements.txt

      - name: Generate new md
        env:
          # Use the workflow's short-lived token instead of a long-lived PAT.
          # The job grants only contents: write and issues: read.
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          source venv/bin/activate
          python main.py "$GH_TOKEN" "$REPO" --issue_number "$ISSUE_NUMBER"

      - name: Push README
        run: |
          git config --local user.email "shengyao.zhu@gmail.com"
          git config --local user.name "cufezhusy"
          git add BACKUP/*.md
          git commit -a -m 'update new blog' || echo "nothing to commit"
          git push || echo "nothing to push"
